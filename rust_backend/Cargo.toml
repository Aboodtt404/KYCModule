[package]
name = "rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.13.2"
ic-cdk-macros = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
candid = "0.10"
ic-stable-structures = "0.6.4"
serde_json = "1.0"
urlencoding = "2.1.3"

[dev-dependencies]
candid_parser = "0.1.0"
