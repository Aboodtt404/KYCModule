<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>hawiya · هوية — Identity verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800&family=Alexandria:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html,body{margin:0;padding:0;background:#efe7d9;font-family:'Alexandria',sans-serif;color:#3d2c22;-webkit-font-smoothing:antialiased}
      *{box-sizing:border-box}
      a{color:#c2410c}a:hover{color:#9a3412}
      input,button{font-family:inherit}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
      @keyframes scan{0%,100%{top:12%}50%{top:82%}}
      @keyframes flipIn{from{transform:perspective(500px) rotateY(88deg);opacity:0}to{transform:none;opacity:1}}
      @keyframes stamp{0%{transform:scale(1.9);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
